# cranwatch watchlist ----------------------------------------------------------
# One key per theme. A package can sit under several themes.
#
# Entry forms:
#   - dplyr                                   # package name (CRAN, archived CRAN, or r-universe)
#   - owner/repo                              # GitHub-hosted; package name = repo name
#   - {pkg: polars, repo: pola-rs/r-polars}   # package name differs from repo name
#
# Lookup order: base R -> CRAN -> r-universe -> CRAN archive -> GitHub repo -> "not-found"
# ("unknown" if a lookup API was down). CRAN deadlines are tracked automatically.
# "# ?" = couldn't confirm it exists; the first run will tell (status / not-found).
# Non-packages (CLIs, books, course repos) and unidentified names live in links.yml.

